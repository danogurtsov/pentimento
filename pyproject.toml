[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentimento"
version = "0.1.0"
description = "An AI audit pipeline for Solidity: detects vulnerabilities, verifies them adversarially, and proves each confirmed finding with a real, executed proof-of-concept."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "danogurtsov" }]
keywords = ["solidity", "evm", "smart-contracts", "audit", "static-analysis", "cdv"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
pentimento = "pentimento.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pentimento"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pentimento/cli.py" = ["B008"]   # typer uses function calls in argument defaults by design

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
