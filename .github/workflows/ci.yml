name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/pentimento   # whole package now clean under strict mode, not just the pure domain core
      - name: install solc 0.8.24
        run: |
          curl -fsSL -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x /usr/local/bin/solc
      - run: pytest -q
      - run: python evals/run_evals.py
        env:
          PENTIMENTO_SOLC_PATH: /usr/local/bin/solc

  # The "fast tier" regression gate for DETECTION QUALITY (not CDV structure, which the
  # `test` job's own evals/run_evals.py already protects for free). This job makes REAL LLM
  # calls (breadth-pass + an independent judge call per fixture) — real cost, and it needs an
  # ANTHROPIC_API_KEY secret this repo doesn't necessarily have. Deliberately gated on an
  # explicit repository VARIABLE (not just secret presence) so a fork/clone never silently
  # starts spending money — set `vars.RUN_DETECTION_REGRESSION` to "true" (Settings > Actions >
  # Variables) only once `secrets.ANTHROPIC_API_KEY` is also configured. See
  # evals/run_detection_regression.py's own module docstring for what this actually checks.
  detection-regression:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_DETECTION_REGRESSION == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: install solc 0.8.24
        run: |
          curl -fsSL -o /usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux
          chmod +x /usr/local/bin/solc
      - name: fetch DeFiVulnLabs fixture corpus (pinned commit, submodules)
        run: |
          git clone --quiet https://github.com/SunWeb3Sec/DeFiVulnLabs.git _external/DeFiVulnLabs
          git -C _external/DeFiVulnLabs checkout --quiet f61f6ee5c3f89eb7685030647f8df19997596f8b
          git -C _external/DeFiVulnLabs submodule update --init lib/forge-std
          git -C _external/DeFiVulnLabs/lib/forge-std submodule update --init lib/ds-test
      # Judge is a DIFFERENT model than the detector (sonnet vs haiku), not the same one
      # checking its own output - see run_detection_regression.py's own module docstring
      # (self-verification measured to roughly halve the tasks a verification loop actually
      # saves). A genuinely different
      # PROVIDER for the judge (e.g. DEEPSEEK_API_KEY + --judge-llm deepseek:deepseek-chat)
      # would be stronger evidence still - not wired here, no second provider key configured.
      - run: >
          python evals/run_detection_regression.py
          --llm anthropic:claude-haiku-4-5
          --judge-llm anthropic:claude-sonnet-5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PENTIMENTO_SOLC_PATH: /usr/local/bin/solc
