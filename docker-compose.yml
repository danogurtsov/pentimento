services:
  model-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ${PENTIMENTO_GATEWAY_CONTAINER:-pentimento-model-gateway}
    ports:
      - "${PENTIMENTO_GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ${PENTIMENTO_REDIS_CONTAINER:-pentimento-redis}
    restart: unless-stopped
